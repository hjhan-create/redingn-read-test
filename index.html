*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--text);font:16px/1.65 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;word-break:keep-all}button,a,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--brand-primary-deep);outline-offset:5px}button:disabled{cursor:wait}a{color:inherit}header{max-width:1100px;margin:auto;padding:25px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);gap:18px}.brand{font-weight:850;font-size:17px;letter-spacing:-.6px;display:flex;align-items:center;gap:10px}.brand-icon{width:30px;height:28px;background:var(--brand-primary);border-radius:5px 5px 12px 5px;display:grid;place-items:center;color:var(--brand-on-primary)}.edition{font-size:12px;letter-spacing:1.8px;color:var(--text-muted)}main{max-width:560px;margin:44px auto 60px;padding:0 20px}h1,h2,h3,p{margin:0}h1{font-size:37px;line-height:1.4;letter-spacing:-1.9px;margin:18px 0}h1 em{font-style:normal;color:var(--brand-primary-deep)}.eyebrow{font-size:13px;font-weight:700;color:var(--brand-primary-deep);display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;background:var(--brand-primary);border-radius:50%}.sub{color:var(--text-muted);line-height:1.8}.illustration{height:166px;position:relative;margin:25px 0;background:var(--brand-tint);border-radius:22px;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:12px}.illustration:before,.illustration:after{content:"";position:absolute;width:210px;height:210px;border:1px solid #cde8c3;border-radius:50%;left:calc(50% - 105px);top:-20px}.illustration:after{width:300px;height:300px;left:calc(50% - 150px);top:-65px}.book{z-index:1;width:78px;height:103px;border-radius:3px 9px 9px 3px;background:var(--dark);color:var(--white);box-shadow:5px 7px 0 #17322212;padding:10px;font-size:10px;letter-spacing:1px;transform:rotate(-12deg);border-left:5px solid #355542}.book strong{display:block;font-size:26px;line-height:1.4;margin-top:7px}.book:nth-child(2){height:118px;background:var(--brand-primary);color:var(--brand-on-primary);transform:rotate(2deg);border-color:#43b123}.book:nth-child(3){transform:rotate(13deg);background:var(--white);color:var(--dark);border-color:#d9e4d4}.tags{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:600;margin:20px 0}.notice{padding:16px 18px;background:var(--brand-tint);border-radius:12px;font-size:14px;margin:20px 0;color:#3b5933}.primary{display:flex;justify-content:center;align-items:center;gap:14px;width:100%;min-height:58px;padding:16px 14px;background:var(--brand-primary);color:var(--brand-on-primary);border:0;border-radius:12px;font-weight:800;text-decoration:none;transition:background .2s,transform .2s}.primary:hover{background:var(--brand-primary-hover);transform:translateY(-1px)}.caption{text-align:center;font-size:12px;color:var(--text-muted);margin-top:11px}.footer{text-align:center;color:var(--text-muted);font-size:12px;letter-spacing:.3px;padding:0 20px 28px}.panel{background:var(--white);border:1px solid var(--border);border-radius:22px;padding:28px;box-shadow:0 12px 35px #17322205}.fade{animation:appear .25s ease-out}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.progress-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:10px}.track{height:6px;border-radius:10px;background:#e7ece5;overflow:hidden}.fill{height:100%;background:var(--brand-primary);transition:width .3s}.question-top{position:sticky;top:0;background:var(--surface);padding:15px 0 24px;z-index:2}.qnum{color:var(--brand-primary-deep);font-weight:800;margin:15px 0 8px}.question{font-size:24px;line-height:1.65;letter-spacing:-.6px;min-height:90px;outline:none}.options{display:grid;gap:10px;margin:24px 0 14px}.option{display:flex;align-items:center;text-align:left;gap:16px;width:100%;min-height:60px;border:1px solid var(--border);border-radius:12px;background:var(--white);padding:12px 18px;color:var(--text);transition:.2s}.option:hover{border-color:var(--brand-primary-deep);background:var(--brand-tint)}.option[aria-checked=true]{border:2px solid var(--brand-primary);background:var(--brand-tint);padding:11px 17px}.number{border:1px solid var(--border);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:13px}.option[aria-checked=true] .number{background:var(--brand-primary);border-color:var(--brand-primary);color:var(--brand-on-primary)}.text-btn{border:0;background:none;color:var(--text-muted);padding:12px;min-height:48px}.loading{text-align:center;padding:90px 0}.spinner{width:60px;height:60px;margin:0 auto 28px;border:5px solid var(--brand-tint);border-top-color:var(--brand-primary-deep);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.result-head{text-align:center}.pill{display:inline-block;padding:7px 14px;background:var(--level-tint);color:var(--level-ink);border:1px solid var(--level);border-radius:30px;font-size:14px;font-weight:800}.keyword{font-size:14px;color:var(--text-muted);margin-top:8px}.score{font-size:54px;font-weight:850;letter-spacing:-2px;margin:8px 0}.score small{font-size:16px;letter-spacing:0;font-weight:400;color:var(--text-muted)}.gauge{position:relative;height:12px;border-radius:12px;background:linear-gradient(to right,var(--stage1) 0% 37.5%,var(--stage2) 37.5% 62.5%,var(--stage3) 62.5% 82.5%,var(--stage4) 82.5%);margin:20px 5px 5px}.marker{position:absolute;top:-5px;width:8px;height:22px;background:var(--dark);border:2px solid var(--white);border-radius:4px;left:0;transform:translateX(-50%);transition:left .8s ease-out}.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:24px}.quote{background:var(--level-tint);padding:24px 20px;border-radius:16px;text-align:center;margin:24px 0}.quote h2{color:var(--level-ink);font-size:23px;line-height:1.6;letter-spacing:-.7px}.quote p{font-size:15px;margin-top:12px}.section-title{font-size:18px;margin-bottom:20px}.area{margin:20px 0}.area-title{display:flex;justify-content:space-between;font-size:15px;font-weight:750}.area .track{margin:8px 0;height:8px}.area .fill{background:var(--dark)}.area p{font-size:12px;color:var(--text-muted)}.area-label{font-size:12px;color:var(--brand-primary-deep);margin-top:6px}.cta-section{margin-top:28px;padding-top:24px;border-top:1px solid var(--border);text-align:center}.cta-section p{font-size:14px;margin-bottom:12px}.actions{display:flex;justify-content:center;gap:15px;margin:18px 0}.sticky{display:none}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);padding:12px 20px;background:var(--dark);color:white;border-radius:12px;z-index:10;font-size:14px;width:max-content;max-width:90vw}.share-box{width:100%;min-height:100px;padding:12px;font:inherit;border:1px solid var(--border);border-radius:12px} [hidden]{display:none!important}@media(max-width:600px){header{padding:18px 20px}.edition{font-size:10px;letter-spacing:1px}.brand{font-size:14px}main{margin-top:28px}h1{font-size:33px}.panel{padding:22px 18px}.tags{font-size:11px}.sticky.visible{display:block;position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);z-index:5;animation:appear .3s}.sticky .primary{font-size:14px;min-height:56px}body.has-result{padding-bottom:100px}.question{font-size:22px}.illustration{height:150px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<body><header><div class="brand"><span class="brand-icon" aria-hidden="true">▤</span> 영어 독서 성향 진단</div><span class="edition">TEACHER’S READING NOTE</span></header><main id="app"></main><footer class="footer">학생들을 이해하는 1분, 영어 독서의 다음 시작.</footer><div id="sticky" class="sticky"></div><div id="toast" class="toast" role="status" hidden></div>
<script>
const WEBINAR_URL='https://forms.gle/5PwKuhqRsydQPdwy5';
const CTA={label:'논문으로 검증된 영어 독서 확인하기',url:WEBINAR_URL};
// 배포 후 필요하면 공개 진단 페이지 URL을 지정하세요. 로컬 파일 경로는 공유하지 않습니다.
const SHARE_URL='';
const QUESTIONS=['우리 학생들은 영어를 좋아한다.','우리 학생들은 영어 읽기를 좋아한다.','우리 학생들은 영어에 호기심이 많다.','우리 학생들은 영어 읽기를 재미있어한다.','우리 학생들은 영어 읽기를 잘하고 싶어한다.','우리 학생들은 영어 읽기에 자신이 있어한다.','우리 학생들은 어려운 영어글을 읽는 것을 좋아한다.','우리 학생들은 길고 어려운 영어글 읽기를 포기하지 않는다.','우리 학생들은 다른 친구들보다 영어글을 잘 읽을 수 있다.','우리 학생들은 다른 친구들보다 영어글을 빨리 이해할 수 있다.'];
const SCALE_LABELS=['전혀 그렇지 않다','그렇지 않다','보통이다','그렇다','매우 그렇다'];
const LEVELS=[
{max:24,name:'잠재력 충전형',keyword:'흥미 탐색',quote:'"올바른 독서법을 만나면 자신감이 쑥 자라나요!"',description:'아직 영어 글읽기가 어색하지만, 검증된 독서 환경을 마련해주면 가장 빠르게 성장할 잠재력이 가득합니다.',color:'var(--stage1)',tint:'var(--tint1)',ink:'#8B5704'},
{max:34,name:'리딩 러너형',keyword:'자신감 형성',quote:'"흥미를 폭발적인 실력으로 바꿀 골든타임!"',description:'영어 읽기의 재미를 알아가는 단계입니다. 학술 연구로 입증된 독서 가이드를 접해주면 확실한 실력 도약이 가능합니다.',color:'var(--stage2)',tint:'var(--tint2)',ink:'#087168'},
{max:42,name:'리딩 에이스형',keyword:'실력 도약',quote:'"탄탄한 기본기, 더 깊은 독서로 올라설 준비 완료!"',description:'영어 글읽기에 자신감이 돋보이는 학생들입니다. 데이터로 입증된 효과적인 확장 독서 전략을 만날 때입니다.',color:'var(--stage3)',tint:'var(--tint3)',ink:'#245ACD'},
{max:50,name:'리딩 마스터형',keyword:'독서가 완성',quote:'"거침없는 리딩 마스터, 완벽한 독서 자산 형성 중!"',description:'어려운 글도 포기하지 않는 당당함이 높습니다. 실제 연구 논문으로 확인된 영어 독서의 장기적 학습 성과를 확인하세요.',color:'var(--stage4)',tint:'var(--tint4)',ink:'#7130D9'}];
const SUBSCALES=[{name:'흥미 · 동기',items:[0,1,2,3,4],caption:'영어와 영어 읽기 자체를 좋아하고 궁금해하는 정도'},{name:'읽기 자신감',items:[5,8,9],caption:'스스로 잘 읽는다고 느끼는 정도'},{name:'도전 · 지속력',items:[6,7],caption:'길고 어려운 글 앞에서 버티는 힘'}];
const app=document.getElementById('app');let answers=Array(10).fill(null),current=0,busy=false,result=null,timers=[];
function track(event,params={}){if(Array.isArray(window.dataLayer))window.dataLayer.push({event,...params});}
function later(fn,ms){timers.push(setTimeout(fn,ms));}
function clearTimers(){timers.forEach(clearTimeout);timers=[];}
function focusTitle(){app.querySelector('[tabindex="-1"]')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
function intro(){clearTimers();document.body.classList.remove('has-result');document.getElementById('sticky').className='sticky';document.getElementById('sticky').innerHTML='';app.innerHTML=`<section class="fade"><div class="eyebrow"><span class="dot"></span>초 · 중 · 고 영어 교사 전용 무료 진단</div><h1 tabindex="-1">우리 학생들의<br>영어 독서 성향,<br><em>지금 1분 만에 확인하세요</em></h1><p class="sub">10개 문항으로 확인하는 우리 학생들의 영어 독서 흥미 · 자신감 · 도전력. 결과에 딱 맞는 검증된 독서 지도법을 안내해 드립니다.</p><div class="illustration" aria-hidden="true"><div class="book"></div><div class="book"></div><div class="book"></div></div><div class="tags"><span>📄 학술 연구 기반 문항</span><span>⏱ 소요 시간 1분</span><span>🆓 무료 · 로그인 불필요</span></div><div class="notice">※ 학생 개인이 아닌, 선생님이 가르치는 '학생들 전체'의 모습을 기준으로 응답해 주세요.</div><button class="primary" id="start">진단 시작하기 <span aria-hidden="true">→</span></button><p class="caption">총 10문항 · 5점 척도</p></section>`;document.getElementById('start').onclick=()=>{track('diagnosis_start');question();};}
function question(){busy=false;app.innerHTML=`<div class="question-top"><div class="progress-head"><strong>영어 독서 성향 알아보기</strong><span>${current+1} / 10</span></div><div class="track" role="progressbar" aria-label="현재 문항" aria-valuenow="${current+1}" aria-valuemin="0" aria-valuemax="10"><div class="fill" style="width:${(current+1)*10}%"></div></div></div><section class="fade"><p class="qnum">Q${current+1}.</p><h2 class="question" id="question-title" tabindex="-1">${QUESTIONS[current]}</h2><div class="options" role="radiogroup" aria-labelledby="question-title">${SCALE_LABELS.map((label,i)=>`<button class="option" role="radio" aria-checked="${answers[current]===i+1}" data-value="${i+1}"><span class="number" aria-hidden="true">${i+1}</span>${label}</button>`).join('')}</div><p class="caption">가장 가까운 답변을 선택해 주세요.</p>${current>0?'<button class="text-btn" id="previous">← 이전</button>':''}</section>`;app.querySelectorAll('[data-value]').forEach((b,i)=>{b.onclick=()=>answer(Number(b.dataset.value));b.onkeydown=e=>{if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();const d=['ArrowDown','ArrowRight'].includes(e.key)?1:-1;app.querySelectorAll('[data-value]')[(i+d+5)%5].focus();}}});const prev=document.getElementById('previous');if(prev)prev.onclick=()=>{if(!busy){current--;question();}};focusTitle();}
function answer(value){if(busy)return;busy=true;answers[current]=value;track('question_answered',{question_no:current+1,value});app.querySelectorAll('[data-value]').forEach(b=>{b.setAttribute('aria-checked',String(Number(b.dataset.value)===value));b.disabled=true;});later(()=>{if(current<9){current++;question();}else loading();},220);}
function loading(){app.innerHTML='<section class="loading" aria-live="polite"><div class="spinner" aria-hidden="true"></div><h2 style="font-size:20px" id="loading-text" tabindex="-1">응답을 분석하고 있어요...</h2><p class="caption">우리 학생들에게 맞는 다음 단계를 준비해요.</p></section>';focusTitle();later(()=>document.getElementById('loading-text').textContent='우리 학생들의 독서 성향을 계산하는 중...',600);later(()=>document.getElementById('loading-text').textContent='맞춤 독서 전략을 찾는 중...',1200);later(showResult,1800);}
function calculate(values){const score=values.reduce((a,b)=>a+b,0);const index=LEVELS.findIndex(l=>score<=l.max);return {score,index,level:index+1,areas:SUBSCALES.map(s=>Math.round((s.items.reduce((a,i)=>a+values[i],0)-s.items.length)/(s.items.length*4)*100))};}
function cta(position){return `<a class="primary" href="${CTA.url}" target="_blank" rel="noopener noreferrer" data-cta="${position}">${CTA.label}<span aria-hidden="true">↗</span></a>`;}
function showResult(){if(answers.some(v=>!Number.isInteger(v)||v<1||v>5)){current=answers.findIndex(v=>!Number.isInteger(v)||v<1||v>5);question();return;}result=calculate(answers);const l=LEVELS[result.index],max=Math.max(...result.areas),min=Math.min(...result.areas);app.innerHTML=`<section class="fade" style="--level:${l.color};--level-tint:${l.tint};--level-ink:${l.ink}" aria-live="polite"><div class="result-head" tabindex="-1"><span class="pill">[${result.level}단계] ${l.name}</span><p class="keyword">(${l.keyword})</p><div class="score">${result.score}<small>점 / 50점</small></div></div><div class="gauge" role="img" aria-label="10점부터 50점 중 ${result.score}점"><span class="marker" id="marker"></span></div><div class="ticks"><span>10</span><span>25</span><span>35</span><span>43</span><span>50</span></div><div class="quote"><h2>${l.quote}</h2><p>${l.description}</p></div><div class="panel"><h3 class="section-title">우리 학생들의 독서 프로필</h3>${SUBSCALES.map((s,i)=>`<div class="area"><div class="area-title"><span>${s.name}</span><span>${result.areas[i]}%</span></div><div class="track"><div class="fill" style="width:${result.areas[i]}%"></div></div><p>${s.caption}</p><div class="area-label">${max===min?'세 영역이 균형을 이루고 있어요':result.areas[i]===max?'우리 학생들의 강점 👍':result.areas[i]===min?'함께 키워볼 부분 🌱':''}</div></div>`).join('')}</div><div class="cta-section"><p>우리 학생들의 단계에 딱 맞는 연수를 준비했어요</p>${cta('inline')}</div><div class="actions"><button class="text-btn" id="retry">다시 진단하기</button></div></section>`;document.body.classList.add('has-result');document.getElementById('sticky').innerHTML=cta('sticky');document.querySelectorAll('[data-cta]').forEach(a=>a.onclick=()=>track('cta_click',{level:result.level,total_score:result.score,cta_position:a.dataset.cta}));document.getElementById('retry').onclick=()=>{track('retry_click',{level:result.level});answers=Array(10).fill(null);current=0;result=null;busy=false;intro();focusTitle();};focusTitle();track('diagnosis_complete',{total_score:result.score,level:result.level});later(()=>document.getElementById('marker').style.left=((result.score-10)/40*100)+'%',50);later(()=>document.getElementById('sticky').classList.add('visible'),1000);}
function toast(message){const t=document.getElementById('toast');t.textContent=message;t.hidden=false;later(()=>t.hidden=true,3000);}
intro();
</script></body></html>
